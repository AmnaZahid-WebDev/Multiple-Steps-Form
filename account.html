<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Details</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .steps {
            width: 810px;
            margin: 20px auto 30px;
            display: flex;
        }

        .step {
           flex: 1;
           background-color: #ccc;
           padding: 10px 12px;
           font-size: 25px;
           text-align: center;
           box-sizing: border-box;
           white-space: nowrap;
        }

        .active {
            background-color: #72a9df;
        }

        fieldset {
            width: 740px;
            height: 420px;
            margin: auto;
            border: 2px solid gray;
        }

        legend {
            font-size: 25px;
        }

        label {
            font-size: 26px;
            font-weight: bold;
        }

        input {
            width: 650px;
            height: 32px;
            font-size: 18px;
            margin-top: 5px;
            margin-bottom: 25px;
            padding-left: 5px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .button {
            width: 190px;
            height: 55px;
            background-color: #064b7a;
            border-radius: 35px;
            color: white;
            font-size: 24px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="steps">
        <div class="step active"> Step 1: Account</div>
        <div class="step">Step 2: Personal Details</div>
        <div class="step">Step 3: Your Review</div>
    </div>

    <form>

        <fieldset>

            <legend>Account</legend>

            <br>

            <label>Email Address:</label><br>
            <input type="email" placeholder="Enter Email"><br>

            <label>Password:</label><br>
            <input type="password" placeholder="Enter Password"><br>

            <label>Confirm Password:</label><br>
            <input type="password" placeholder="Confirm Password"><br>

            <div class="buttons">

            <a href="index.html">
            <img src="Images/back.png" alt="Back" width="180">
            </a>

            <a href="personal.html">
            <img src="Images/next.png" alt="Next" width="180">
            </a>

        </div>
        </fieldset>
</form>
</body>
</html>
